# WaDesk development environment. Use via bin/wadesk-dev (see docs/wadesk/README.md).
name: wadesk-dev

x-env: &env
  POSTGRES_HOST: db
  POSTGRES_USERNAME: postgres
  POSTGRES_PASSWORD: ''
  REDIS_URL: redis://redis:6379
  REDIS_PASSWORD: ''  # overrides the demo .env, which dotenv would otherwise load
  FRONTEND_URL: http://localhost:3300
  SECRET_KEY_BASE: wadesk-development-only-secret-key-base-not-for-production-use-0123456789abcdef
  ENABLE_ACCOUNT_SIGNUP: 'true'
  # WaDesk engine as seen from Chatwoot (development values).
  WADESK_ENGINE_URL: http://engine:4000
  WADESK_ENGINE_API_TOKEN: wadesk-dev-engine-api-token-not-for-production
  WADESK_ENGINE_CALLBACK_BASE_URL: http://web:3000
  WADESK_ENGINE_WEBHOOK_SECRET: wadesk-dev-webhook-secret-not-for-production
  # Emails (e.g. "WhatsApp connection expired") go to the Mailpit catcher: http://localhost:8025
  SMTP_ADDRESS: mailpit
  SMTP_PORT: '1025'
  # Keep pnpm's package cache in a volume instead of the repo (pnpm defaults to the mount root).
  npm_config_store_dir: /pnpm-store

x-toolbox: &toolbox
  build:
    context: .
    dockerfile: docker/dockerfiles/wadesk-dev.Dockerfile
  image: wadesk-dev-toolbox:latest
  volumes:
    - ./:/app:z  # :z relabels for SELinux hosts (Fedora); harmless elsewhere
    - bundle:/usr/local/bundle
    - node_modules:/app/node_modules
    - engine_node_modules:/app/wadesk-engine/node_modules
    - pnpm_store:/pnpm-store
  environment: *env
  depends_on: [db, redis]

services:
  toolbox:
    <<: *toolbox
    command: sleep infinity

  web:
    <<: *toolbox
    profiles: [app]
    environment:
      <<: *env
      VITE_RUBY_HOST: vite
    command: sh -c 'rm -f tmp/pids/server.pid && bundle exec rails s -b 0.0.0.0 -p 3000'
    ports: ['127.0.0.1:3300:3000']
    depends_on: [db, redis, vite]

  # Same as web, but serves the prebuilt frontend bundle (bin/wadesk-dev ui-bundle) instead of the Vite dev
  # server, and never compiles the frontend itself: for machines with too little memory to build it.
  web-prebuilt:
    <<: *toolbox
    profiles: [prebuilt]
    environment:
      <<: *env
      VITE_RUBY_AUTO_BUILD: 'false'
    command: sh -c 'rm -f tmp/pids/server.pid && bundle exec rails s -b 0.0.0.0 -p 3000'
    ports: ['127.0.0.1:3300:3000']
    # The engine and Chatwoot's env address Rails as "web" in both profiles.
    networks:
      default:
        aliases: [web]

  worker:
    <<: *toolbox
    profiles: [app, prebuilt]
    command: bundle exec sidekiq -C config/sidekiq.yml

  vite:
    <<: *toolbox
    profiles: [app]
    environment:
      <<: *env
      VITE_RUBY_HOST: 0.0.0.0
      # Rails proxies asset requests with Host "vite"; allow it without editing vite.config.ts.
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: vite
    command: bin/vite dev
    ports: ['127.0.0.1:3036:3036']
    depends_on: []

  # Catches every email Chatwoot sends in development; read them at http://localhost:8025.
  mailpit:
    image: docker.io/axllent/mailpit:v1.27
    profiles: [app, prebuilt]
    environment:
      # Chatwoot sends a (blank) login whenever SMTP_USERNAME is set, even to ''; accept it like MailHog did.
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    ports: ['127.0.0.1:8025:8025']

  # Internal WhatsApp Web engine, with reload on change. Published on 127.0.0.1:4400 for local curl testing only.
  engine:
    <<: *toolbox
    profiles: [app, prebuilt]
    working_dir: /app/wadesk-engine
    environment:
      <<: *env
      # Same database as Chatwoot dev, own schema `wadesk_engine` (ADR-0004).
      WADESK_ENGINE_DATABASE_URL: postgres://postgres@db:5432/chatwoot_dev
      # Development-only secrets; production values come from the deployment's secret store.
      WADESK_ENGINE_API_TOKEN: wadesk-dev-engine-api-token-not-for-production
      WADESK_ENGINE_ENCRYPTION_KEY: ZGV2LW9ubHktZW5jcnlwdGlvbi1rZXktMzJieXRlcyE=
      WADESK_ENGINE_WEBHOOK_SECRET: wadesk-dev-webhook-secret-not-for-production
    command: sh -c 'pnpm install --frozen-lockfile && pnpm dev'
    ports: ['127.0.0.1:4400:4000']

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes: [db:/var/lib/postgresql/data]

  redis:
    image: redis:alpine

volumes:
  bundle:
  node_modules:
  engine_node_modules:
  pnpm_store:
  db:
