name: WaDesk CI

# Runs on every pull request: lint, frontend tests, the targeted backend suite
# (all WhatsApp-related specs plus every spec file the PR adds or changes), and the wadesk-engine checks.
# Each job runs only when its part of the repo changed (or this workflow changed), to save CI minutes.
# The full Chatwoot suite is run manually via "Run Chatwoot CE spec".
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read # job-level permissions replace the workflow's, so checkout needs this again
      pull-requests: read
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ci: &ci
              - '.github/workflows/wadesk_ci.yml'
            engine:
              - *ci
              - 'wadesk-engine/**'
            frontend:
              - *ci
              - 'app/javascript/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'vite.shared.*'
              - 'vitest.setup.js'
              - 'tailwind.config.js'
            backend:
              - *ci
              - 'app/**'
              - 'lib/**'
              - 'config/**'
              - 'db/**'
              - 'spec/**'
              - 'Gemfile'
              - 'Gemfile.lock'
              - '.rubocop.yml'
              - 'rubocop/**'

  engine:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      WADESK_ENGINE_DATABASE_URL: postgres://postgres@localhost:5432/wadesk_engine_test
    defaults:
      run:
        working-directory: wadesk-engine
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: wadesk-engine/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: wadesk-engine/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build image
        run: docker build -t wadesk-engine:ci .

  lint-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Run Rubocop
        run: bundle exec rubocop --parallel

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile
      - name: Run ESLint
        run: pnpm run eslint
      - name: Run frontend tests
        run: pnpm run test

  backend-targeted:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --entrypoint redis-server
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile
      - name: Strip enterprise code
        run: rm -rf enterprise spec/enterprise
      - name: Prepare database
        run: bundle exec rake db:create db:schema:load
      # Production preloads all code; this proves the app boots there without enterprise/ (licence, enterprise audit P0).
      - name: Boot in production mode without enterprise code
        run: >-
          bundle exec rails runner
          'Rails.application.eager_load!; abort("enterprise code loaded") if ChatwootApp.enterprise?; puts "Production boot OK"'
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE: wadesk-ci-boot-check-not-a-secret
          POSTGRES_DATABASE: chatwoot_test
          POSTGRES_USERNAME: postgres
          POSTGRES_PASSWORD: ''
      - name: Select specs
        run: |
          BASE=${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          {
            find spec -path '*whatsapp*' -name '*_spec.rb'
            echo spec/services/conversations/message_window_service_spec.rb
            git diff --name-only --diff-filter=AM "$BASE" HEAD -- 'spec/**/*_spec.rb' | grep -v '^spec/enterprise/' || true
          } | sort -u | while read -r f; do [ -f "$f" ] && echo "$f"; done > tmp/spec_targets.txt
          echo "Running $(wc -l < tmp/spec_targets.txt) spec files"; cat tmp/spec_targets.txt
      - name: Run targeted backend specs
        run: bundle exec rspec --format progress $(cat tmp/spec_targets.txt)
        env:
          # Specs that render full pages (e.g. Super Admin) build the frontend on first use; it needs a larger heap.
          NODE_OPTIONS: --max-old-space-size=6144 --openssl-legacy-provider
      - name: Upload rails log folder
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rails-log-folder
          path: log
